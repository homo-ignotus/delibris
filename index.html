<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delibris</title>
  <style>
    body { font-family: Georgia, serif; max-width: 650px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; }
    h1 { margin-bottom: 0; }
    .tagline { color: #666; margin-top: 4px; }
    .stars { color: #d4a017; font-size: 1.3em; }
    article { border-top: 1px solid #ddd; margin-top: 30px; padding-top: 20px; }
  </style>
</head>
<body>
  <h1>Delibris</h1>
  <p class="tagline">Short opinions on the books I'm reading.</p>

  <article>
    <h2>Book Title</h2>
    <p>by Author Name</p>
    <p class="stars">★★★★☆</p>
    <p>Your review goes here.</p>
  </article>
</body>
</html>
